<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #F7F2EA; color: #2E2521; font-family: 'Golos Text', system-ui, sans-serif; font-size: 20px; line-height: 1.65; }
  a { color: #3B2E28; } a:hover { color: #A3835F; }
</style>
</helmet>
<div style="padding: clamp(40px, 6vw, 72px) clamp(14px, 4vw, 40px); background: #F7F2EA;">
  <div style="max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="2">
      <div style="background: #FFFFFF; border: 1px solid #E4DACD; border-radius: 12px; overflow: hidden;">
        <div onClick="{{ w.toggle }}" style="display: grid; grid-template-columns: 54px 1fr 28px; align-items: center; gap: 16px; padding: clamp(18px, 2.4vw, 24px) clamp(18px, 2.6vw, 26px); cursor: pointer;" style-hover="background: #FBF7F1;">
          <span style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: #F1E9DE; color: #8A5A2B; font-size: 20px; font-weight: 700;">{{ w.n }}</span>
          <span style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: clamp(21px, 2.4vw, 26px); font-weight: 700; letter-spacing: -.02em; line-height: 1.25;">{{ w.title }}</span>
            <span style="font-size: 17px; color: #7D7167; line-height: 1.4;">{{ w.q }}</span>
          </span>
          <span style="font-size: 24px; color: #A3835F; text-align: center;">{{ w.sign }}</span>
        </div>
        <sc-if value="{{ w.open }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 clamp(18px, 2.6vw, 26px) clamp(20px, 2.6vw, 26px) clamp(88px, 9vw, 96px); display: flex; flex-direction: column; gap: 14px;">
            <p style="margin: 0; font-size: 19px; line-height: 1.55;">{{ w.lead }}</p>
            <div style="border-top: 1px solid #EFE7DC; padding-top: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 18px; line-height: 1.5; color: #5C5149;">
              <div style="font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #A3835F;">3 техники недели</div>
              <sc-for list="{{ w.tricks }}" as="t" hint-placeholder-count="3">
                <div>{{ t }}</div>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script type="text/plain">class Component extends DCLogic {
  state = { open: 0 };
  renderVals() {
    const data = [{"n":"1","title":"Фигура эмпата","q":"Кто я такой? Это дар или со мной что-то не так?","lead":"Эмпатия как суперсила: природный интеллект, который нужно развивать и использовать.","tricks":["как отличить эмпатию от слияния и созависимости","упражнения на распознавание своего эмпатического канала","формирование новой самоидентификации: «Я — эмпат, и это моя сила»"]},{"n":"2","title":"Эмпат и отношения с людьми","q":"Почему мной пользуются? Как отказать и не чувствовать себя виноватым?","lead":"Выход из зависимой позиции в созидательную позицию взрослого.","tricks":["распознавание признаков токсичного взаимодействия","техники быстрого возвращения в себя после общения","как отказывать без чувства вины"]}];
    return { weeks: data.map((w, i) => ({
      ...w,
      tricks: w.tricks.map(t => '— ' + t),
      open: this.state.open === i,
      sign: this.state.open === i ? '–' : '+',
      toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i }))
    })) };
  }
}</script>
</body>
</html>
